<svg width="900" height="220"
     viewBox="0 0 900 220"
     xmlns="http://www.w3.org/2000/svg">

<style>

text{
font-family:JetBrains Mono,Consolas,monospace;
fill:#e6edf3;
}

.bg{
fill:#161b22;
}

.blue{
fill:#4F8DFF;
}

.glow{
filter:url(#glow);
}

.small{
font-size:24px;
}

.big{
font-size:44px;
font-weight:bold;
}

</style>

<defs>

<filter id="glow">
<feGaussianBlur stdDeviation="4" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<linearGradient id="scan"
x1="0"
y1="0"
x2="1"
y2="0">

<stop offset="0%" stop-color="transparent"/>
<stop offset="50%" stop-color="#4F8DFF" stop-opacity=".25"/>
<stop offset="100%" stop-color="transparent"/>

<animateTransform
attributeName="gradientTransform"
type="translate"
from="-1 0"
to="1 0"
dur="5s"
repeatCount="indefinite"/>

</linearGradient>

</defs>

<rect class="bg" width="900" height="220" rx="18"/>

<rect
width="900"
height="220"
fill="url(#scan)"/>

<text
x="50"
y="75"
class="big glow blue">

&gt;_

</text>

<text
x="120"
y="75"
class="big">

JaJa

</text>

<text
x="120"
y="120"
class="small">

Development

</text>

<text
x="320"
y="120"
class="small">

Security

</text>

<text
x="500"
y="120"
class="small">

Local AI

</text>

<text
x="670"
y="120"
class="small">

Linux

</text>

<line
x1="120"
y1="145"
x2="770"
y2="145"
stroke="#4F8DFF"
stroke-width="2"
opacity=".6"/>

<rect
x="120"
y="165"
width="3"
height="26"
fill="#4F8DFF">

<animate
attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</rect>

<circle cx="810" cy="60" r="2" fill="#4F8DFF">
<animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
</circle>

<circle cx="835" cy="110" r="2" fill="#4F8DFF">
<animate attributeName="cy" values="110;95;110" dur="4s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
</circle>

<circle cx="785" cy="160" r="2" fill="#4F8DFF">
<animate attributeName="cy" values="160;145;160" dur="5s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
</circle>

</svg>
